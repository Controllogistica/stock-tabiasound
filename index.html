<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0E1116" />
<title>Tabia'S Sound · Control de Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --chrome:#0E1116; --chrome-2:#171C24; --chrome-line:#272E38;
    --bg:#F4F5F7; --card:#FFFFFF; --text:#14171A; --muted:#6B7280; --line:#E6E8EC;
    --teal:#0EA5A4; --teal-dark:#0B8281; --teal-soft:#E0F5F4;
    --danger:#DC2626; --ok:#16A34A;
    --son:#2563EB; --ilu:#F59E0B; --vid:#22C55E; --ina:#FB7185;
    --gen:#64748B; --tar:#6366F1; --gral:#9CA3AF;
    --radius:14px; --shadow:0 1px 2px rgba(16,22,30,.06),0 4px 16px rgba(16,22,30,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  #root{min-height:100vh}
  .mono{font-variant-numeric:tabular-nums}
  .wordmark{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:500;font-size:11px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;background:
    radial-gradient(1200px 500px at 50% -10%, #1d2530 0%, transparent 60%), var(--chrome);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:380px}
  .login-brand{text-align:center;margin-bottom:30px}
  .login-brand .name{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    font-size:30px;color:#fff;line-height:1}
  .login-brand .sub{font-family:'Oswald';text-transform:uppercase;letter-spacing:.32em;font-weight:400;
    font-size:12px;color:var(--teal);margin-top:10px}
  .login-box{background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:var(--radius);padding:26px 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:#9aa4b2;margin-bottom:6px}
  .field input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--chrome-line);
    background:#0E1218;color:#fff;font-size:15px;outline:none}
  .field input:focus{border-color:var(--teal)}
  .btn-primary{width:100%;padding:13px;border-radius:10px;background:var(--teal);color:#04201f;
    font-weight:700;font-size:15px;transition:.15s}
  .btn-primary:hover{background:var(--teal-dark);color:#fff}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .login-err{background:#3a1518;border:1px solid #5b2126;color:#ffb4b4;font-size:13px;
    padding:10px 12px;border-radius:9px;margin-bottom:14px}

  /* ---------- SHELL ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--chrome);color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-bottom:1px solid var(--chrome-line)}
  .topbar .brand{font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:17px}
  .topbar .brand span{color:var(--teal)}
  .topbar .who{display:flex;align-items:center;gap:10px}
  .topbar .who .nm{font-size:13px;color:#c2c9d2;text-align:right;line-height:1.2}
  .topbar .who .nm small{display:block;color:#7e8794;font-size:11px}
  .icon-btn{width:36px;height:36px;border-radius:9px;background:var(--chrome-2);color:#cbd2db;
    display:grid;place-items:center;font-size:16px;border:1px solid var(--chrome-line)}
  .icon-btn:hover{color:#fff}

  .nav{position:sticky;top:57px;z-index:20;background:#fff;border-bottom:1px solid var(--line);
    display:flex;gap:4px;padding:0 12px}
  .nav button{padding:13px 14px;font-size:14px;font-weight:600;color:var(--muted);
    border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .nav button.active{color:var(--text);border-color:var(--teal)}

  .page{max-width:980px;margin:0 auto;padding:18px 14px 90px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:12px}
  .page-head h1{font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em;font-weight:600;
    font-size:22px;margin:0}
  .page-head .count{font-size:13px;color:var(--muted)}

  /* ---------- SEARCH + FILTERS ---------- */
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:11px;border:1px solid var(--line);
    background:#fff;font-size:15px;outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--teal)}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.active{color:var(--text);border-color:var(--text);background:#fff}
  .chip.active.all{background:var(--chrome);color:#fff;border-color:var(--chrome)}

  /* ---------- PRODUCT LIST ---------- */
  .list{display:flex;flex-direction:column;gap:9px}
  .pcard{display:flex;align-items:stretch;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:1px solid transparent;transition:.12s}
  .pcard:hover{border-color:var(--line);transform:translateY(-1px)}
  .pcard .bar{width:5px;flex:0 0 5px}
  .pcard .thumb{width:58px;height:58px;flex:0 0 58px;margin:9px 0 9px 10px;border-radius:10px;
    background:#F1F3F5;display:grid;place-items:center;overflow:hidden;color:#aab1ba}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover}
  .pcard .body{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .pcard .nm{font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pcard .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px}
  .tag .dot{width:7px;height:7px;border-radius:50%}
  .tag.area{background:#F3F4F6;color:#4b5563}
  .tag.tipo-ser{background:#EAF0FF;color:#2540a8}
  .tag.tipo-gra{background:#EAF7EF;color:#1d7a44}
  .tag.kit{background:#FBEFEA;color:#9a4a25}
  .pcard .right{flex:0 0 auto;padding:10px 14px 10px 6px;display:flex;flex-direction:column;
    align-items:flex-end;justify-content:center;gap:3px}
  .pcard .qty{font-family:'Oswald';font-weight:600;font-size:20px;line-height:1}
  .pcard .qty small{font-size:11px;color:var(--muted);font-weight:500;font-family:'Inter'}
  .pcard .cod{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}

  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
  .pager button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font-weight:600;font-size:14px;color:var(--text)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .info{font-size:13px;color:var(--muted)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px;opacity:.4}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(14,17,22,.55);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;animation:rise .22s ease}
  @keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
  .sheet-head{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;z-index:2}
  .sheet-head .t{font-family:'Oswald';text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:600}
  .sheet-body{padding:18px}
  .img-block{position:relative;width:100%;aspect-ratio:16/10;background:#F1F3F5;border-radius:12px;
    overflow:hidden;display:grid;place-items:center;color:#aab1ba;margin-bottom:18px}
  .img-block img{width:100%;height:100%;object-fit:cover}
  .img-upload{position:absolute;bottom:10px;right:10px;background:rgba(14,17,22,.82);color:#fff;
    padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .img-upload input{display:none}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.04em}
  .frow input[type=text],.frow input[type=number],.frow select{width:100%;padding:11px 13px;border-radius:10px;
    border:1px solid var(--line);font-size:15px;background:#fff;outline:none}
  .frow input:focus,.frow select:focus{border-color:var(--teal)}
  .frow input:disabled{background:#F6F7F9;color:#7b828c}
  .ro{font-size:15px;font-weight:500}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .units{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
  .units .u{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
    border-bottom:1px solid var(--line);font-size:13px}
  .units .u:last-child{border-bottom:none}
  .units .u .c{font-family:ui-monospace,monospace;font-weight:600}
  .est{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .est.disponible{background:#EAF7EF;color:#1d7a44}
  .est.en_evento{background:#EAF0FF;color:#2540a8}
  .est.en_reparacion{background:#FFF4E5;color:#9a6213}
  .est.baja,.est.perdido{background:#FBEAEA;color:#a82626}
  .save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;
    display:flex;gap:10px}
  .btn-save{flex:1;padding:13px;border-radius:11px;background:var(--teal);color:#04201f;font-weight:700;font-size:15px}
  .btn-save:hover{background:var(--teal-dark);color:#fff}
  .btn-save:disabled{opacity:.55}
  .btn-ghost{padding:13px 18px;border-radius:11px;background:#F1F3F5;color:var(--text);font-weight:600}

  /* ---------- USUARIOS ---------- */
  .ucard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;
    margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ucard .ui{flex:1;min-width:160px}
  .ucard .ui .n{font-weight:600;font-size:15px}
  .ucard .ui .r{font-size:12px;color:var(--muted);margin-top:2px}
  .ucard .ctrls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .switch{position:relative;width:48px;height:28px;flex:0 0 48px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.2s}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked+.slider{background:var(--teal)}
  .switch input:checked+.slider:before{transform:translateX(20px)}
  .ucard select{padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:14px;background:#fff}
  .ucard select:disabled{opacity:.45}
  .ubtn{padding:9px 14px;border-radius:9px;background:var(--chrome);color:#fff;font-weight:600;font-size:13px}
  .ubtn:disabled{opacity:.4}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--chrome);color:#fff;
    padding:12px 20px;border-radius:11px;font-size:14px;font-weight:500;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.3);
    animation:rise .2s ease}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);
    border-radius:50%;animation:spin .8s linear infinite;margin:50px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-load{display:grid;place-items:center;min-height:60vh}

  /* ---------- GESTIÓN: unidades / historial / archivar ---------- */
  .u-row{border-bottom:1px solid var(--line)}
  .u-row:last-child{border-bottom:none}
  .u-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-size:13px}
  .u-head .c{font-family:ui-monospace,monospace;font-weight:600}
  .u-edit{padding:12px;background:#FAFBFC;border-top:1px dashed var(--line)}
  .u-actions{display:flex;gap:8px;margin-top:2px}
  .u-actions .btn-save{flex:1;padding:11px}
  .btn-danger{padding:11px 14px;border-radius:10px;background:#FDECEC;color:var(--danger);font-weight:700;font-size:14px}
  .btn-danger:hover{background:#f7d9d9}
  .btn-danger:disabled{opacity:.55}
  .hist{margin-top:12px}
  .hist-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
  .hist-i{display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
  .hist-i .d{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 62px}
  .hist-empty{font-size:12.5px;color:var(--muted);padding:4px 0}
  .addunit{margin-top:10px;padding:12px;border:1px solid var(--teal);border-radius:11px;background:var(--teal-soft)}
  .addunit .row{display:flex;gap:8px}
  .addunit input{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:14px;background:#fff}
  .add-btn{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1px dashed #b9c0ca;background:#fff;
    color:var(--teal-dark);font-weight:700;font-size:14px}
  .add-btn:hover{border-color:var(--teal);background:var(--teal-soft)}
  .tipo-line{display:flex;align-items:center;gap:10px}
  .tipo-line .ro{flex:0 0 auto}
  .link-btn{font-size:12.5px;font-weight:700;color:var(--teal-dark);background:none;padding:0;text-decoration:underline}
  .link-btn:disabled{opacity:.5}
  .danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .arch-banner{background:#FFF4E5;border:1px solid #f0d9a8;color:#8a5a12;padding:10px 12px;border-radius:10px;
    font-size:13px;margin-bottom:14px}
  .arch-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px;cursor:pointer}
  .arch-toggle input{width:16px;height:16px}

  /* ---------- REMITOS ---------- */
  .rwrap{max-width:760px;margin:0 auto;padding:20px 16px 90px}
  .page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .ph-title{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.02em}
  .btn-primary{background:var(--teal);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;font-size:14px}
  .btn-primary:hover{background:var(--teal-dark)}
  .btn-primary.wide,.btn-ghost.wide{width:100%;padding:14px}
  .empty{color:var(--muted);font-size:14px;padding:34px 4px;text-align:center}
  .rem-list{display:flex;flex-direction:column;gap:10px}
  .rem-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;cursor:pointer}
  .rem-card:hover{border-color:var(--teal)}
  .rem-ev{font-weight:700;font-size:15px}
  .rem-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .rem-est{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
  .rem-est.e-pendiente{background:#FFF4E5;color:#8a5a12}
  .rem-est.e-en_evento{background:#E7F0FF;color:#1d4ed8}
  .rem-est.e-cerrado{background:#EAF7EE;color:#1f8a4c}
  .det-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:12px 0 18px}
  .scan-box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:18px}
  .scan-box>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .scan-row{display:flex;gap:8px}
  .scan-row input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;font-family:ui-monospace,monospace}
  .scan-hint{font-size:11.5px;color:var(--muted);margin-top:8px}
  .lin-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:10px}
  .lin-list{display:flex;flex-direction:column;gap:8px}
  .lin-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px}
  .lin-row.dev{opacity:.55}
  .lin-nm{font-weight:600;font-size:14px}
  .lin-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .lin-badge.ok{font-size:11px;font-weight:700;color:#1f8a4c;background:#EAF7EE;padding:5px 10px;border-radius:20px;white-space:nowrap}
  .lin-x{font-size:12.5px;font-weight:700;color:var(--danger);background:none}
  .lin-dev{font-size:12.5px;font-weight:700;color:#fff;background:var(--teal);padding:8px 14px;border-radius:9px}
  .lin-acts{display:flex;gap:8px;align-items:center}
  .seg{display:flex;gap:4px;background:#EEF1F4;border-radius:10px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);background:none}
  .seg button.on{background:#fff;color:#1f2937;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .det-actions{margin-top:20px}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* Red de seguridad: si algo no carga, mostrarlo en pantalla en vez de quedar en blanco */
window.onerror=function(msg){var r=document.getElementById('root');
  if(r&&r.children.length===0){r.style.background='#fff';
    r.innerHTML='<div style="padding:30px;font-family:system-ui;color:#b00"><h3>Se produjo un error al iniciar</h3><pre style="white-space:pre-wrap;font-size:13px">'+msg+'</pre></div>';}};
</script>
<!-- Las librerías (React, ReactDOM, Babel, Supabase) se cargan dinámicamente más abajo, con CDN de respaldo -->

<script type="text/plain" id="appsrc">
const { useState, useEffect, useRef, useCallback } = React;

/* ====== CONFIG ====== */
const SUPABASE_URL = "https://qnpcrhapvyynwvuljxze.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucGNyaGFwdnl5bnd2dWxqeHplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzIzMjEsImV4cCI6MjA5NTkwODMyMX0.ri8T4xQjzwCP9md7spCem0u-Gr6RO3EnmqiTmrtUwRo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const PAGE_SIZE = 24;

const AREA_COLORS = {
  'Sonido':'#2563EB','Iluminación':'#F59E0B','Pantallas LED/Video':'#22C55E',
  'Sistemas Inalámbricos':'#FB7185','Generadores':'#64748B',
  'Tarimas y Escenarios':'#6366F1','General/Accesorios':'#9CA3AF'
};
const areaColor = n => AREA_COLORS[n] || '#9CA3AF';

/* ====== APP ROOT ====== */
function App(){
  const [session,setSession]=useState(undefined); // undefined=loading
  const [perfil,setPerfil]=useState(undefined);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(session===undefined) return;
    if(!session){ setPerfil(null); return; }
    sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle()
      .then(({data})=>setPerfil(data||{__sinperfil:true}));
  },[session]);

  if(session===undefined||(session&&perfil===undefined))
    return <div className="center-load" style={{background:'#0E1116'}}><div className="spinner"/></div>;
  if(!session) return <Login/>;
  if(!perfil||perfil.__sinperfil||!perfil.puede_stock) return <NoAccess perfil={perfil}/>;
  return <Shell perfil={perfil} user={session.user}/>;
}

  const [err,setErr]=useState(''),[loading,setLoading]=useState(false);
  const go=async()=>{
    setErr('');setLoading(true);

          {err&&<div className="login-err">{err}</div>}

            <input type="email" value={email} autoCapitalize="off" autoCorrect="off"
              onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="tu@mail.com"/></div>

}

/* ====== REMITOS ====== */
const EMPRESA_ID='deb16582-fbad-4b0c-9de9-80c2fd14a609';
const remEstLabel=e=>({pendiente:'Armando',en_evento:'En evento',cerrado:'Cerrado'}[e]||e);
const fmtFecha=s=>{ try{ return new Date(String(s).length<=10?s+'T00:00:00':s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}); }catch(e){ return ''; } };
const fmtRango=(a,b)=>{ if(!a&&!b) return 'sin fechas'; if(a&&b) return fmtFecha(a)+' → '+fmtFecha(b); return fmtFecha(a||b); };

function Remitos({perfil,showToast}){
  const [remitos,setRemitos]=useState(null);
  const [sel,setSel]=useState(null);
  const [creating,setCreating]=useState(false);
  const load=()=>sb.from('stock_remitos').select('*').order('creado_en',{ascending:false}).limit(100).then(({data})=>setRemitos(data||[]));
  useEffect(()=>{ load(); },[]);
  if(sel) return <RemitoDetalle remito={sel} showToast={showToast} onBack={()=>{setSel(null);load();}}/>;
  return (
    <div className="rwrap">
      <div className="page-head"><h1 className="ph-title">Remitos</h1>
        <button className="btn-primary" onClick={()=>setCreating(true)}>+ Nuevo</button></div>
      {remitos===null?<div className="spinner"/>:
       remitos.length===0?<div className="empty">Todavía no hay remitos. Creá el primero con “+ Nuevo”.</div>:
       <div className="rem-list">{remitos.map(r=>(
         <div className="rem-card" key={r.id} onClick={()=>setSel(r)}>
           <div className="rem-main">
             <div className="rem-ev">{r.evento||'(sin evento)'}</div>
             <div className="rem-sub">{r.cliente||'—'} · {fmtRango(r.fecha_desde,r.fecha_hasta)}</div>
           </div>
           <span className={'rem-est e-'+r.estado}>{remEstLabel(r.estado)}</span>
         </div>))}</div>}
      {creating&&<NuevoRemito onClose={()=>setCreating(false)} onCreated={(r)=>{setCreating(false);load();setSel(r);}}/>}
    </div>
  );
}

function NuevoRemito({onClose,onCreated}){
  const [f,setF]=useState({evento:'',cliente:'',desde:'',hasta:'',obs:''});
  const [saving,setSaving]=useState(false);
  const set=(k,v)=>setF(o=>{const n={...o};n[k]=v;return n;});
  const crear=async()=>{
    if(!f.evento.trim()){ alert('Poné al menos el nombre del evento.'); return; }
    setSaving(true);
    const {data,error}=await sb.from('stock_remitos').insert({
      empresa_id:EMPRESA_ID, evento:f.evento.trim(), cliente:f.cliente.trim()||null,
      fecha_desde:f.desde||null, fecha_hasta:f.hasta||null, observacion:f.obs.trim()||null, estado:'pendiente'
    }).select().single();
    setSaving(false);
    if(error){ alert('No se pudo crear el remito.'); return; }
    onCreated(data);
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-head"><div className="t">Nuevo remito</div>
          <button className="icon-btn" style={{background:'#F1F3F5',color:'#444'}} onClick={onClose}>✕</button></div>
        <div className="sheet-body">
          <div className="frow"><label>Evento</label><input value={f.evento} onChange={e=>set('evento',e.target.value)} placeholder="Ej: Show Luna Park"/></div>
          <div className="frow"><label>Cliente</label><input value={f.cliente} onChange={e=>set('cliente',e.target.value)}/></div>
          <div className="grid2">
            <div className="frow"><label>Desde</label><input type="date" value={f.desde} onChange={e=>set('desde',e.target.value)}/></div>
            <div className="frow"><label>Hasta</label><input type="date" value={f.hasta} onChange={e=>set('hasta',e.target.value)}/></div>
          </div>
          <div className="frow"><label>Observación</label><input value={f.obs} onChange={e=>set('obs',e.target.value)}/></div>
        </div>
        <div className="save-bar">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-save" disabled={saving} onClick={crear}>{saving?'Creando…':'Crear remito'}</button>
        </div>
      </div>
    </div>
  );
}

function RemitoDetalle({remito,showToast,onBack}){
  const [r,setR]=useState(remito);
  const [lineas,setLineas]=useState(null);
  const [code,setCode]=useState('');
  const [busy,setBusy]=useState(false);
  const [userId,setUserId]=useState(null);
  const [modo,setModo]=useState('agregar');
  const inputRef=useRef(null);
  const armando=r.estado==='pendiente';
  const enEvento=r.estado==='en_evento';

  useEffect(()=>{ sb.auth.getUser().then(({data})=>setUserId(data.user?data.user.id:null)); },[]);
  const loadLineas=useCallback(async()=>{
    const {data:ls}=await sb.from('stock_remito_lineas')
      .select('id,cantidad,devuelto,fecha_salida,fecha_devolucion,unidad_id,producto_id')
      .eq('remito_id',r.id).order('fecha_salida',{ascending:true,nullsFirst:true});
    const lns=ls||[];
    const uids=[...new Set(lns.filter(l=>l.unidad_id).map(l=>l.unidad_id))];
    const pids=[...new Set(lns.filter(l=>l.producto_id).map(l=>l.producto_id))];
    const um={},pm={};
    if(uids.length){ const {data}=await sb.from('stock_unidades').select('id,codigo,estado').in('id',uids); (data||[]).forEach(u=>{um[u.id]=u;}); }
    if(pids.length){ const {data}=await sb.from('stock_productos').select('id,nombre,codigo_granel').in('id',pids); (data||[]).forEach(p=>{pm[p.id]=p;}); }
    setLineas(lns.map(l=>{ const o={...l}; o._u=um[l.unidad_id]||null; o._p=pm[l.producto_id]||null; return o; }));
  },[r.id]);
  useEffect(()=>{ loadLineas(); },[loadLineas]);

  const logHist=async(o)=>{ await sb.from('stock_historial').insert({empresa_id:EMPRESA_ID,unidad_id:o.unidad_id||null,producto_id:o.producto_id||null,remito_id:r.id,accion:o.accion,detalle:o.detalle||null,usuario_id:userId}); };
  const refocus=()=>{ if(inputRef.current) inputRef.current.focus(); };

  const scanSalida=async(c)=>{
    const {data:u}=await sb.from('stock_unidades').select('id,codigo,estado,producto_id,activo').eq('codigo',c).eq('activo',true).maybeSingle();
    if(u){
      if(u.estado==='en_evento'){ alert('Esa unidad ya está en un evento.'); return; }
      await sb.from('stock_remito_lineas').insert({remito_id:r.id,unidad_id:u.id,producto_id:u.producto_id,cantidad:1,fecha_salida:new Date().toISOString()});
      await sb.from('stock_unidades').update({estado:'en_evento'}).eq('id',u.id);
      await logHist({unidad_id:u.id,accion:'salida',detalle:'Salida — '+(r.evento||'remito')});
      loadLineas(); return;
    }
    let p=null;
    const r1=await sb.from('stock_productos').select('id,nombre,codigo_granel,codigo_producto').eq('codigo_granel',c).maybeSingle(); p=r1.data;
    if(!p){ const r2=await sb.from('stock_productos').select('id,nombre,codigo_granel,codigo_producto').eq('codigo_producto',c).maybeSingle(); p=r2.data; }
    if(p){
      const qty=Number(prompt('Cantidad de "'+p.nombre+'" a sacar:','1'))||0;
      if(qty>0){
        await sb.from('stock_remito_lineas').insert({remito_id:r.id,producto_id:p.id,cantidad:qty,fecha_salida:new Date().toISOString()});
        await logHist({producto_id:p.id,accion:'salida',detalle:'Salida x'+qty+' — '+(r.evento||'remito')});
        loadLineas();
      }
      return;
    }
    alert('Código no encontrado: '+c);
  };

  const devolverLinea=async(l)=>{
    await sb.from('stock_remito_lineas').update({devuelto:true,fecha_devolucion:new Date().toISOString()}).eq('id',l.id);
    if(l.unidad_id){ await sb.from('stock_unidades').update({estado:'disponible'}).eq('id',l.unidad_id);
      await logHist({unidad_id:l.unidad_id,accion:'devolucion',detalle:'Devolución — '+(r.evento||'remito')}); }
    else await logHist({producto_id:l.producto_id,accion:'devolucion',detalle:'Devolución — '+(r.evento||'remito')});
    loadLineas();
  };
  const scanDevolucion=async(c)=>{
    let l=(lineas||[]).find(x=>x._u&&x._u.codigo===c&&!x.devuelto);
    if(!l) l=(lineas||[]).find(x=>!x.unidad_id&&x._p&&x._p.codigo_granel===c&&!x.devuelto);
    if(!l){ alert('Ese código no está pendiente de devolución en este remito.'); return; }
    await devolverLinea(l);
  };

  const onScan=async()=>{
    const c=code.trim(); if(!c||busy) return;
    setBusy(true);
    try{ if(modo==='devolver'&&enEvento) await scanDevolucion(c); else await scanSalida(c); }
    catch(e){ alert('Error: '+(e&&e.message?e.message:e)); }
    setBusy(false); setCode(''); refocus();
  };

  const quitarLinea=async(l)=>{
    if(!confirm('¿Quitar este ítem del remito?')) return;
    await sb.from('stock_remito_lineas').delete().eq('id',l.id);
    if(l.unidad_id) await sb.from('stock_unidades').update({estado:'disponible'}).eq('id',l.unidad_id);
    loadLineas();
  };

  const confirmarSalida=async()=>{
    if(!lineas||!lineas.length){ alert('Agregá al menos un equipo antes de confirmar la salida.'); return; }
    if(!confirm('¿Confirmar salida del equipo para "'+(r.evento||'remito')+'"?')) return;
    await sb.from('stock_remitos').update({estado:'en_evento'}).eq('id',r.id);
    setR(prev=>{const n={...prev};n.estado='en_evento';return n;}); setModo('devolver'); if(showToast) showToast('Salida confirmada');
  };
  const cerrarRemito=async()=>{
    const pend=(lineas||[]).filter(l=>!l.devuelto).length;
    if(pend>0 && !confirm('Quedan '+pend+' ítems sin devolver. ¿Cerrar igual? Los que no volvieron quedan marcados como en evento.')) return;
    await sb.from('stock_remitos').update({estado:'cerrado'}).eq('id',r.id);
    setR(prev=>{const n={...prev};n.estado='cerrado';return n;}); if(showToast) showToast('Remito cerrado');
  };

  const pendientes=(lineas||[]).filter(l=>!l.devuelto).length;
  return (
    <div className="rwrap">
      <button className="link-btn" onClick={onBack}>‹ Volver a remitos</button>
      <div className="det-head">
        <div><div className="rem-ev" style={{fontSize:20}}>{r.evento||'(sin evento)'}</div>
          <div className="rem-sub">{r.cliente||'—'} · {fmtRango(r.fecha_desde,r.fecha_hasta)}</div></div>
        <span className={'rem-est e-'+r.estado}>{remEstLabel(r.estado)}</span>
      </div>

      {(armando||enEvento)&&
        <div className="scan-box">
          {enEvento&&
            <div className="seg">
              <button className={modo==='agregar'?'on':''} onClick={()=>{setModo('agregar');refocus();}}>Agregar equipo</button>
              <button className={modo==='devolver'?'on':''} onClick={()=>{setModo('devolver');refocus();}}>Devolver</button>
            </div>}
          <label>{modo==='devolver'?'Devolución — escaneá lo que vuelve o escribí el código':'Cargar equipo — escaneá con la pistola o escribí el código'}</label>
          <div className="scan-row">
            <input ref={inputRef} value={code} onChange={e=>setCode(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') onScan(); }} placeholder="Código…" autoFocus/>
            <button className="btn-save" disabled={busy} onClick={onScan}>{busy?'…':(modo==='devolver'?'Devolver':'Agregar')}</button>
          </div>
          <div className="scan-hint">📷 El escaneo con cámara llega en la próxima etapa. Por ahora: pistola o a mano.</div>
        </div>}

      <div className="lin-head">Ítems ({lineas?lineas.length:'…'}){enEvento&&lineas?' · pendientes de devolver: '+pendientes:''}</div>
      {lineas===null?<div className="spinner"/>:
       lineas.length===0?<div className="empty">Sin ítems todavía.</div>:
       <div className="lin-list">{lineas.map(l=>(
         <div className={'lin-row'+(l.devuelto?' dev':'')} key={l.id}>
           <div className="lin-main">
             <div className="lin-nm">{l._p?l._p.nombre:'(producto)'}</div>
             <div className="lin-sub">
               {l.unidad_id?<span className="mono">{l._u?l._u.codigo:'—'}</span>:<span>x{l.cantidad} · {(l._p&&l._p.codigo_granel)||'granel'}</span>}
             </div>
           </div>
           {l.devuelto?<span className="lin-badge ok">Devuelto</span>:
             <div className="lin-acts">
               <button className="lin-x" onClick={()=>quitarLinea(l)}>Quitar</button>
               {enEvento&&<button className="lin-dev" onClick={()=>devolverLinea(l)}>Devolver</button>}
             </div>}
         </div>))}</div>}

      {armando&&<div className="det-actions"><button className="btn-primary wide" onClick={confirmarSalida}>Confirmar salida</button></div>}
      {enEvento&&<div className="det-actions"><button className="btn-ghost wide" onClick={cerrarRemito}>Cerrar remito</button></div>}
    </div>
  );
}

  const [tab,setTab]=useState('catalogo');
  const [toast,setToast]=useState('');
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2200);};
  const nombre=(perfil.nombre||user.email||'').split(' ')[0];
  return (
    <div>
      <div className="topbar">
        <div className="brand">Tabia'S <span>Stock</span></div>
        <div className="who">
          <div className="nm">{nombre}<small>{rolLabel(perfil.rol_stock)}</small></div>
          <button className="icon-btn" title="Cerrar sesión" onClick={()=>sb.auth.signOut()}>⏻</button>
        </div>
      </div>
      <div className="nav">
        <button className={tab==='catalogo'?'active':''} onClick={()=>setTab('catalogo')}>Catálogo</button>
        <button className={tab==='remitos'?'active':''} onClick={()=>setTab('remitos')}>Remitos</button>

const rolLabel=r=>({admin:'Administrador',jefe_area:'Jefe de área',operador:'Operador'}[r]||'Stock');

/* ====== CATALOGO ====== */
function Catalogo({perfil,showToast}){
  const canEdit = perfil.rol_stock==='admin'||perfil.rol_stock==='jefe_area';
  const [areas,setAreas]=useState([]);
  const [search,setSearch]=useState('');
  const [debounced,setDebounced]=useState('');
  const [areaFilter,setAreaFilter]=useState(null);
  const [page,setPage]=useState(0);
  const [rows,setRows]=useState([]);
  const [count,setCount]=useState(0);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [verArchivados,setVerArchivados]=useState(false);

  useEffect(()=>{ sb.from('stock_areas').select('*').order('orden').then(({data})=>setAreas(data||[])); },[]);
  useEffect(()=>{ const t=setTimeout(()=>{setDebounced(search);setPage(0);},300); return ()=>clearTimeout(t); },[search]);

  const load=useCallback(async()=>{
    setLoading(true);
    let q=sb.from('vw_stock_productos').select('*',{count:'exact'});
    if(debounced) q=q.or(`nombre.ilike.%${debounced}%,codigo_granel.ilike.%${debounced}%`);
    if(areaFilter) q=q.eq('area_id',areaFilter);
    q=q.eq('archivado',verArchivados);
    q=q.order('area_orden',{nullsFirst:false}).order('nombre').range(page*PAGE_SIZE,page*PAGE_SIZE+PAGE_SIZE-1);
    const {data,count}=await q;
    setRows(data||[]); setCount(count||0); setLoading(false);
  },[debounced,areaFilter,page,verArchivados]);
  useEffect(()=>{ load(); },[load]);

  const totalPages=Math.max(1,Math.ceil(count/PAGE_SIZE));
  const closeModal=(changed)=>{ setSel(null); if(changed){ load(); showToast('Cambios guardados'); } };

  return (
    <div className="page">
      <div className="page-head">
        <h1>Catálogo</h1>
        <div className="count">{count.toLocaleString('es-AR')} productos</div>
      </div>
      <div className="search">
        <span className="mag">⌕</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nombre o código…"/>
      </div>
      <div className="chips">
        <button className={'chip all'+(areaFilter===null?' active':'')} onClick={()=>{setAreaFilter(null);setPage(0);}}>Todas</button>
        {areas.map(a=>(
          <button key={a.id} className={'chip'+(areaFilter===a.id?' active':'')}
            onClick={()=>{setAreaFilter(a.id);setPage(0);}}>
            <span className="dot" style={{background:areaColor(a.nombre)}}/>{a.nombre}</button>
        ))}
      </div>

      {canEdit&&
        <label className="arch-toggle">
          <input type="checkbox" checked={verArchivados} onChange={e=>{setVerArchivados(e.target.checked);setPage(0);}}/>
          Ver archivados
        </label>}

      {loading? <div className="spinner"/> :
       rows.length===0? <div className="empty"><div className="big">⌕</div>No hay productos que coincidan.</div> :
       <div className="list">{rows.map(p=><ProductCard key={p.id} p={p} onClick={()=>setSel(p)}/>)}</div>}

      {!loading&&count>PAGE_SIZE&&
        <div className="pager">
          <button disabled={page===0} onClick={()=>{setPage(p=>p-1);window.scrollTo(0,0);}}>← Anterior</button>
          <span className="info">Página {page+1} de {totalPages}</span>
          <button disabled={page+1>=totalPages} onClick={()=>{setPage(p=>p+1);window.scrollTo(0,0);}}>Siguiente →</button>
        </div>}

      {sel&&<ProductModal p={sel} areas={areas} canEdit={canEdit} isAdmin={perfil.rol_stock==='admin'} onClose={closeModal}/>}
    </div>
  );
}

function ProductCard({p,onClick}){
  const ser=p.tipo_control==='serializado';
  const cant=ser?p.unidades_count:p.cantidad_total;
  return (
    <div className="pcard" onClick={onClick}>
      <div className="bar" style={{background:areaColor(p.area_nombre)}}/>
      <div className="thumb">{p.imagen_url?<img src={p.imagen_url} alt=""/>:<span style={{fontSize:22}}>📦</span>}</div>
      <div className="body">
        <div className="nm">{p.nombre}</div>
        <div className="meta">
          <span className="tag area"><span className="dot" style={{background:areaColor(p.area_nombre)}}/>{p.area_nombre||'—'}</span>
          <span className={'tag '+(ser?'tipo-ser':'tipo-gra')}>{ser?'Serializado':'Granel'}</span>
          {p.es_kit&&<span className="tag kit">Kit</span>}
        </div>
      </div>
      <div className="right">
        <div className="qty mono">{cant}<small> u.</small></div>
        {!ser&&p.codigo_granel&&<div className="cod">{p.codigo_granel}</div>}
      </div>
    </div>
  );
}

/* ====== helpers de stock ====== */
const ESTADOS=['disponible','en_evento','en_reparacion','baja','perdido'];
const estLabel=e=>({disponible:'Disponible',en_evento:'En evento',en_reparacion:'En reparación',baja:'Baja',perdido:'Perdido'}[e]||e);
const fechaCorta=s=>{ try{ return new Date(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }catch(e){ return ''; } };
function nextCode(units){
  const parsed=units.map(u=>String(u.codigo||'').match(/^(.*?)(\d+)$/)).filter(Boolean);
  if(!parsed.length) return '';
  const byPre={};
  parsed.forEach(m=>{ (byPre[m[1]]=byPre[m[1]]||[]).push(m); });
  let best=null;
  Object.keys(byPre).forEach(k=>{ if(!best||byPre[k].length>best.length) best=byPre[k]; });
  let maxNum=-1,width=1;
  best.forEach(m=>{ const n=Number(m[2]); if(n>maxNum){ maxNum=n; width=m[2].length; } });
  return best[0][1]+String(maxNum+1).padStart(width,'0');
}

function HistList({hist}){
  if(hist===null) return <div className="hist-empty">…</div>;
  if(!hist.length) return <div className="hist-empty">Sin movimientos.</div>;
  return <div>{hist.map((h,i)=>(
    <div className="hist-i" key={i}><span className="d">{fechaCorta(h.creado_en)}</span><span>{h.detalle||h.accion}</span></div>
  ))}</div>;
}

/* ====== FILA DE UNIDAD ====== */
function UnitRow({u,canEdit,logHist,onChanged}){
  const [open,setOpen]=useState(false);
  const [codigo,setCodigo]=useState(u.codigo||'');
  const [estado,setEstado]=useState(u.estado||'disponible');
  const [obs,setObs]=useState('');
  const [hist,setHist]=useState(null);
  const [busy,setBusy]=useState(false);
  const loadHist=()=>sb.from('stock_historial').select('accion,detalle,creado_en')
    .eq('unidad_id',u.id).order('creado_en',{ascending:false}).limit(20).then(({data})=>setHist(data||[]));
  const toggle=()=>{ const n=!open; setOpen(n); if(n&&hist===null) loadHist(); };
  const guardar=async()=>{
    setBusy(true);
    const patch={}; const cambios=[];
    if(codigo.trim()&&codigo.trim()!==u.codigo){ patch.codigo=codigo.trim(); cambios.push('Código → '+codigo.trim()); }
    if(estado!==u.estado){ patch.estado=estado; cambios.push('Estado → '+estLabel(estado)); }
    if(obs.trim()) patch.observacion=obs.trim();
    if(!Object.keys(patch).length){ setBusy(false); setOpen(false); return; }
    const {error}=await sb.from('stock_unidades').update(patch).eq('id',u.id);
    if(error){ setBusy(false); alert('No se pudo guardar la unidad. Puede que ese código ya exista.'); return; }
    let det=cambios.join(' · '); if(obs.trim()) det=(det?det+' · ':'')+'Obs: '+obs.trim();
    if(det) await logHist({unidad_id:u.id,accion:'edicion_unidad',detalle:det});
    setBusy(false); onChanged();
  };
  const quitar=async()=>{
    if(!confirm('¿Quitar esta unidad del inventario? Queda archivada y se puede recuperar.')) return;
    setBusy(true);
    const {error}=await sb.from('stock_unidades').update({activo:false}).eq('id',u.id);
    if(error){ setBusy(false); alert('No se pudo quitar la unidad.'); return; }
    await logHist({unidad_id:u.id,accion:'baja_unidad',detalle:'Quitada del inventario'});
    setBusy(false); onChanged();
  };
  return (
    <div className="u-row">
      <div className="u-head" onClick={toggle}>
        <span className="c">{u.codigo}</span>
        <span className={'est '+u.estado}>{estLabel(u.estado)}</span>
      </div>
      {open&&
        <div className="u-edit">
          {canEdit&&
            <div>
              <div className="frow"><label>Código / Nº de serie</label>
                <input type="text" value={codigo} onChange={e=>setCodigo(e.target.value)}/></div>
              <div className="frow"><label>Estado</label>
                <select value={estado} onChange={e=>setEstado(e.target.value)}>
                  {ESTADOS.map(s=><option key={s} value={s}>{estLabel(s)}</option>)}
                </select></div>
              <div className="frow"><label>Observación (queda en el historial con fecha)</label>
                <input type="text" value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ej: mandado a reparar a…"/></div>
              <div className="u-actions">
                <button className="btn-danger" disabled={busy} onClick={quitar}>Quitar</button>
                <button className="btn-save" disabled={busy} onClick={guardar}>{busy?'…':'Guardar unidad'}</button>
              </div>
            </div>}
          <div className="hist"><div className="hist-t">Historial</div><HistList hist={hist}/></div>
        </div>}
    </div>
  );
}

/* ====== MOVIMIENTOS DEL PRODUCTO ====== */
function ProdHistory({productId}){
  const [open,setOpen]=useState(false);
  const [hist,setHist]=useState(null);
  const toggle=()=>{ const n=!open; setOpen(n);
    if(n&&hist===null) sb.from('stock_historial').select('accion,detalle,creado_en')
      .eq('producto_id',productId).order('creado_en',{ascending:false}).limit(30).then(({data})=>setHist(data||[])); };
  return (
    <div className="frow" style={{marginTop:6}}>
      <button className="link-btn" onClick={toggle}>{open?'Ocultar movimientos':'Ver movimientos del producto'}</button>
      {open&&<div className="hist" style={{marginTop:8}}><HistList hist={hist}/></div>}
    </div>
  );
}

/* ====== PRODUCT MODAL ====== */
function ProductModal({p,areas,canEdit,isAdmin,onClose}){
  const [tipo,setTipo]=useState(p.tipo_control);
  const ser=tipo==='serializado';
  const [nombre,setNombre]=useState(p.nombre||'');
  const [areaId,setAreaId]=useState(p.area_id||'');
  const [cantidad,setCantidad]=useState(p.cantidad_total||0);
  const [img,setImg]=useState(p.imagen_url||'');
  const [units,setUnits]=useState(null);
  const [saving,setSaving]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [userId,setUserId]=useState(null);
  const [adding,setAdding]=useState(false);
  const [newCode,setNewCode]=useState('');
  const [newSerie,setNewSerie]=useState('');
  const [busyTipo,setBusyTipo]=useState(false);
  const changed=useRef(false);
  const empresaId=p.empresa_id;
  const archivado=p.archivado;

  const reloadUnits=useCallback(()=>{
    sb.from('stock_unidades').select('id,codigo,nro_serie_fabricante,estado,observacion')
      .eq('producto_id',p.id).eq('activo',true).order('codigo').then(({data})=>setUnits(data||[]));
  },[p.id]);

  useEffect(()=>{ sb.auth.getUser().then(({data})=>setUserId(data.user?data.user.id:null)); },[]);
  useEffect(()=>{ if(ser) reloadUnits(); },[ser,reloadUnits]);

  const logHist=useCallback(async(o)=>{
    await sb.from('stock_historial').insert({
      empresa_id:empresaId, unidad_id:o.unidad_id||null,
      producto_id:o.producto_id||(o.unidad_id?null:p.id),
      accion:o.accion, detalle:o.detalle||null, usuario_id:userId });
  },[empresaId,userId,p.id]);

  const mark=()=>{ changed.current=true; };
  const close=()=>onClose(changed.current);

  const upload=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    setUploading(true);
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${p.id}.${ext}`;
    const {error}=await sb.storage.from('productos').upload(path,file,{upsert:true,cacheControl:'3600'});
    if(error){ setUploading(false); alert('No se pudo subir la imagen.'); return; }
    const {data}=sb.storage.from('productos').getPublicUrl(path);
    setImg(data.publicUrl+'?t='+Date.now()); setUploading(false);
  };

  const guardarBasicos=async()=>{
    setSaving(true);
    const patch={nombre,area_id:areaId||null,imagen_url:img||null};
    if(!ser) patch.cantidad_total=Number(cantidad)||0;
    const {error}=await sb.from('stock_productos').update(patch).eq('id',p.id);
    if(error){ setSaving(false); alert('No se pudo guardar.'); return; }
    if(!ser && (Number(cantidad)||0)!==(p.cantidad_total||0))
      await logHist({producto_id:p.id,accion:'cambio_cantidad',detalle:'Cantidad → '+(Number(cantidad)||0)});
    setSaving(false); mark(); onClose(true);
  };

  const addUnit=async()=>{
    if(!newCode.trim()){ alert('Escribí (o escaneá) el código.'); return; }
    setSaving(true);
    const {error}=await sb.from('stock_unidades').insert({
      empresa_id:empresaId, producto_id:p.id, codigo:newCode.trim(),
      nro_serie_fabricante:newSerie.trim()||null, estado:'disponible', activo:true });
    if(error){ setSaving(false); alert('No se pudo agregar. Puede que ese código ya exista.'); return; }
    await logHist({producto_id:p.id,accion:'alta_unidad',detalle:'Alta de unidad '+newCode.trim()});
    setSaving(false); mark(); setNewCode(''); setNewSerie(''); reloadUnits();
  };

  const pasarAGranel=async()=>{
    const n=(units||[]).length;
    if(!confirm('Pasar a GRANEL: se archivan los '+n+' códigos individuales (se pueden recuperar) y queda solo la cantidad ('+n+'). ¿Seguir?')) return;
    setBusyTipo(true);
    await sb.from('stock_unidades').update({activo:false}).eq('producto_id',p.id).eq('activo',true);
    const {error}=await sb.from('stock_productos').update({tipo_control:'cantidad',cantidad_total:n}).eq('id',p.id);
    if(error){ setBusyTipo(false); alert('No se pudo cambiar el tipo.'); return; }
    await logHist({producto_id:p.id,accion:'cambio_tipo',detalle:'Serializado → Granel ('+n+' u.)'});
    setBusyTipo(false); mark(); setTipo('cantidad'); setCantidad(n);
  };
  const pasarASerial=async()=>{
    if(!confirm('Pasar a SERIALIZADO: vas a cargar el código de cada aparato (uno por uno o escaneando). ¿Seguir?')) return;
    setBusyTipo(true);
    const {error}=await sb.from('stock_productos').update({tipo_control:'serializado'}).eq('id',p.id);
    if(error){ setBusyTipo(false); alert('No se pudo cambiar el tipo.'); return; }
    await logHist({producto_id:p.id,accion:'cambio_tipo',detalle:'Granel → Serializado'});
    setBusyTipo(false); mark(); setTipo('serializado'); setNewCode(''); setAdding(true);
  };

  const archivar=async()=>{
    const motivo=prompt('¿Por qué lo archivás? (desuso, pérdida, etc.) — opcional, podés dejar vacío');
    if(motivo===null) return;
    setSaving(true);
    const {error}=await sb.from('stock_productos').update({archivado:true,archivado_en:new Date().toISOString(),archivado_motivo:motivo||null}).eq('id',p.id);
    if(error){ setSaving(false); alert('No se pudo archivar.'); return; }
    await logHist({producto_id:p.id,accion:'archivado',detalle:'Archivado'+(motivo?': '+motivo:'')});
    setSaving(false); mark(); onClose(true);
  };
  const restaurar=async()=>{
    setSaving(true);
    const {error}=await sb.from('stock_productos').update({archivado:false,archivado_en:null,archivado_motivo:null}).eq('id',p.id);
    if(error){ setSaving(false); alert('No se pudo restaurar.'); return; }
    await logHist({producto_id:p.id,accion:'restaurado',detalle:'Restaurado'});
    setSaving(false); mark(); onClose(true);
  };

  return (
    <div className="overlay" onClick={close}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-head">
          <div className="t">{ser?'Producto serializado':'Producto a granel'}</div>
          <button className="icon-btn" style={{background:'#F1F3F5',color:'#444'}} onClick={close}>✕</button>
        </div>
        <div className="sheet-body">
          {archivado&&<div className="arch-banner">📦 Este producto está <b>archivado</b>. Restauralo para volver a usarlo.</div>}
          <div className="img-block">
            {img?<img src={img} alt=""/>:<span style={{fontSize:40}}>📦</span>}
            {canEdit&&<label className="img-upload">{uploading?'Subiendo…':'📷 Foto'}
              <input type="file" accept="image/*" onChange={upload} disabled={uploading}/></label>}
          </div>

          <div className="frow"><label>Nombre</label>
            <input type="text" value={nombre} disabled={!canEdit} onChange={e=>setNombre(e.target.value)}/></div>

          <div className="grid2">
            <div className="frow"><label>Área</label>
              {canEdit?
                <select value={areaId} onChange={e=>setAreaId(e.target.value)}>
                  <option value="">— Sin área —</option>
                  {areas.map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}
                </select>
                :<div className="ro">{p.area_nombre||'—'}</div>}
            </div>
            <div className="frow"><label>Tipo</label>
              <div className="tipo-line">
                <div className="ro">{ser?'Serializado':'Granel'}{p.es_kit?' · Kit':''}</div>
                {canEdit&&(ser?
                  <button className="link-btn" disabled={busyTipo} onClick={pasarAGranel}>→ a granel</button>
                  :<button className="link-btn" disabled={busyTipo} onClick={pasarASerial}>→ a serializado</button>)}
              </div>
            </div>
          </div>

          {!ser?
            <div className="grid2">
              <div className="frow"><label>Cantidad</label>
                <input type="number" min="0" value={cantidad} disabled={!canEdit}
                  onChange={e=>setCantidad(e.target.value)}/></div>
              <div className="frow"><label>Código</label>
                <div className="ro mono">{p.codigo_granel||'—'}</div></div>
            </div>
            :
            <div className="frow"><label>Unidades ({units?units.length:'…'})</label>
              {units===null?<div style={{color:'#999',fontSize:13,padding:'8px 0'}}>Cargando…</div>:
               <div className="units">{units.length===0?
                  <div style={{padding:'10px 12px',fontSize:13,color:'var(--muted)'}}>Todavía no hay unidades cargadas.</div>:
                  units.map(u=><UnitRow key={u.id} u={u} canEdit={canEdit} logHist={logHist} onChanged={()=>{mark();reloadUnits();}}/>)}
               </div>}
              {canEdit&&(adding?
                <div className="addunit">
                  <div className="row">
                    <input type="text" value={newCode} onChange={e=>setNewCode(e.target.value)} placeholder="Código / escaneo"/>
                    <input type="text" value={newSerie} onChange={e=>setNewSerie(e.target.value)} placeholder="Nº serie (opc.)"/>
                  </div>
                  <div className="u-actions" style={{marginTop:8}}>
                    <button className="btn-ghost" onClick={()=>{setAdding(false);setNewCode('');setNewSerie('');}}>Cancelar</button>
                    <button className="btn-save" disabled={saving} onClick={addUnit}>{saving?'…':'Agregar unidad'}</button>
                  </div>
                </div>
                :<button className="add-btn" onClick={()=>{setNewCode(nextCode(units||[]));setAdding(true);}}>+ Agregar unidad</button>)}
            </div>}

          {p.codigo_producto&&<div className="frow"><label>Código Rentman</label>
            <div className="ro mono">{p.codigo_producto}</div></div>}

          {!ser&&<ProdHistory productId={p.id}/>}

          {canEdit&&
            <div className="danger-zone">
              {archivado?
                <button className="btn-save" disabled={saving} onClick={restaurar} style={{flex:1}}>Restaurar producto</button>
                :<button className="btn-danger" disabled={saving} onClick={archivar} style={{flex:1}}>Archivar producto</button>}
            </div>}
        </div>

        {canEdit&&!archivado&&
          <div className="save-bar">
            <button className="btn-ghost" onClick={close}>Cerrar</button>
            <button className="btn-save" disabled={saving} onClick={guardarBasicos}>{saving?'Guardando…':'Guardar cambios'}</button>
          </div>}
      </div>
    </div>
  );
}

/* ====== USUARIOS ====== */
function Usuarios({showToast}){
  const [rows,setRows]=useState(null);
  const [savingId,setSavingId]=useState(null);
  useEffect(()=>{ sb.from('perfiles').select('id,nombre,apellido,rol,puede_stock,rol_stock')
    .order('nombre').then(({data})=>setRows(data||[])); },[]);

  const upd=(id,patch)=>setRows(rs=>rs.map(r=>r.id===id?{...r,...patch}:r));
  const save=async(r)=>{
    setSavingId(r.id);
    const patch={puede_stock:r.puede_stock,rol_stock:r.puede_stock?(r.rol_stock||'operador'):null};
    const {error}=await sb.from('perfiles').update(patch).eq('id',r.id);
    setSavingId(null);
    if(error){ alert('No se pudo guardar.'); return; }
    upd(r.id,patch); showToast('Usuario actualizado');
  };

  if(rows===null) return <div className="page"><div className="spinner"/></div>;
  return (
    <div className="page">
      <div className="page-head"><h1>Usuarios</h1>
        <div className="count">{rows.length} personas</div></div>
      <p style={{fontSize:13,color:'var(--muted)',margin:'0 0 16px'}}>
        Prendé el acceso a Stock y elegí el rol. Entran con su mismo mail y contraseña de Control de Horas.</p>
      {rows.map(r=>(
        <div className="ucard" key={r.id}>
          <div className="ui">
            <div className="n">{(r.nombre||'')+' '+(r.apellido||'')||'—'}</div>
            <div className="r">{r.rol||'sin rol'}</div>
          </div>
          <div className="ctrls">
            <label className="switch">
              <input type="checkbox" checked={!!r.puede_stock}
                onChange={e=>upd(r.id,{puede_stock:e.target.checked})}/>
              <span className="slider"></span>
            </label>
            <select value={r.rol_stock||'operador'} disabled={!r.puede_stock}
              onChange={e=>upd(r.id,{rol_stock:e.target.value})}>
              <option value="operador">Operador</option>
              <option value="jefe_area">Jefe de área</option>
              <option value="admin">Administrador</option>
            </select>
            <button className="ubtn" disabled={savingId===r.id} onClick={()=>save(r)}>
              {savingId===r.id?'…':'Guardar'}</button>
          </div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

<script>
/* Carga React, ReactDOM, Babel y Supabase en orden, cada una con un CDN de respaldo. Recién con todo listo, compila la app (modo classic) y arranca. */
(function(){
  var root=document.getElementById('root');
  function showErr(m){ if(root){ root.style.background='#fff';
    root.innerHTML='<div style="padding:30px;font-family:system-ui;color:#b00"><h3>Se produjo un error al iniciar</h3><pre style="white-space:pre-wrap;font-size:13px">'+m+'</pre></div>'; } }
  var libs=[
    {n:'React', g:'React', u:['https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','https://unpkg.com/react@18.3.1/umd/react.production.min.js']},
    {n:'ReactDOM', g:'ReactDOM', u:['https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js']},
    {n:'Babel', g:'Babel', u:['https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js','https://unpkg.com/@babel/standalone@7.24.7/babel.min.js']},
    {n:'Supabase', g:'supabase', u:['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js']}
  ];
  function loadOne(lib,done){
    var i=0;
    (function attempt(){
      if(window[lib.g]) return done(true);
      if(i>=lib.u.length) return done(false);
      var s=document.createElement('script');
      s.src=lib.u[i++];
      s.onload=function(){ if(window[lib.g]) done(true); else attempt(); };
      s.onerror=attempt;
      document.head.appendChild(s);
    })();
  }
  (function chain(k){
    if(k>=libs.length) return boot();
    loadOne(libs[k],function(ok){
      if(!ok) return showErr('No se pudo cargar la librería: '+libs[k].n+'.\nProbá recargar la página; si sigue, puede ser un bloqueador o la conexión.');
      chain(k+1);
    });
  })(0);
  function boot(){
    try{
      var src=document.getElementById('appsrc').textContent;
      var out=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
      var s=document.createElement('script'); s.textContent=out; document.body.appendChild(s);
    }catch(e){ showErr((e&&e.message)?e.message:String(e)); }
  }
})();
</script>
